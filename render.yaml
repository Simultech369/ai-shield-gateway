services:
  - type: web
    name: ai-shield-gateway
    env: docker
    plan: free
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3000
      - key: BASE_RPC_URL
        value: https://mainnet.base.org
      - key: PAYMENT_RECIPIENT_ADDRESS
        value: 0xEa3A353Fb3fc88DB8F0FA1E6Ea541FEdc9F5F0E7
      - key: PRICE_PER_CALL_USDC
        value: 0.05
